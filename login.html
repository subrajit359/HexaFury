<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Signup - Brainware University</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      color: #333;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #800000;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 1rem;
      font-weight: bold;
    }

    input, select {
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.75rem;
      background-color: #800000;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #a00000;
    }

    .switch {
      text-align: center;
      margin-top: 1rem;
    }

    .switch a {
      color: #800000;
      text-decoration: none;
      cursor: pointer;
    }

    .switch a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Signup Form -->
  <form action="hostel.php" method="post"></form>
      <div class="container" id="signup">
    <h2>Signup - Brainware University</h2>
    <form action="#" method="post">
      <label for="role">Signup as:</label>
      <select id="role" name="role" required onchange="toggleStudentCode('signup')">
        <option value="">-- Select Role --</option>
        <option value="student">Student</option>
        <option value="staff">Staff</option>
      </select>

      <div id="signup-student-code" class="hidden">
        <label for="student-code-signup">Student Code:</label>
        <input type="text" id="student-code-signup" name="student_code" placeholder="Enter student code">
      </div>

      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter full name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter email" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>

      <button type="submit">Signup</button>
    </form>
    <div class="switch">
      Already have an account? <a href="#login">Login</a>
    </div>
  </div>

  <!-- Login Form -->
  
  <div class="container" id="login" style="display: none; margin-top: 3rem;">
    <h2>Login - Brainware University</h2>
    <form action="#" method="post">
      <label for="login-role">Login as:</label>
      <select id="login-role" name="login-role" required onchange="toggleStudentCode('login')">
        <option value="">-- Select Role --</option>
        <option value="student">Student</option>
        <option value="staff">Staff</option>
      </select>

      <div id="login-student-code" class="hidden">
        <label for="student-code-login">Student Code:</label>
        <input type="text" id="student-code-login" name="student_code" placeholder="Enter student code">
      </div>

      <label for="login-email">Email:</label>
      <input type="email" id="login-email" name="login-email" placeholder="Enter email" required>

      <label for="login-password">Password:</label>
      <input type="password" id="login-password" name="login-password" placeholder="Enter password" required>
     <button type="button" onclick="location.href='complain.html'">Login</button>

    </form>
    <div class="switch">
      Don't have an account? <a href="#signup">Signup</a>
    </div>
  </div>

  <script>
    function toggleStudentCode(formType) {
      const roleSelect = document.getElementById(formType === 'signup' ? 'role' : 'login-role');
      const studentCodeDiv = document.getElementById(formType === 'signup' ? 'signup-student-code' : 'login-student-code');

      if (roleSelect.value === 'student') {
        studentCodeDiv.classList.remove('hidden');
      } else {
        studentCodeDiv.classList.add('hidden');
      }
    }

    // Toggle between login and signup views
    document.querySelectorAll('.switch a').forEach(link => {
      link.addEventListener('click', function(event) {
        event.preventDefault();
        const targetId = this.getAttribute('href').substring(1); // removes '#' from href
        const signupForm = document.getElementById('signup');
        const loginForm = document.getElementById('login');

        if (targetId === 'signup') {
          signupForm.style.display = 'block';
          loginForm.style.display = 'none';
        } else if (targetId === 'login') {
          signupForm.style.display = 'none';
          loginForm.style.display = 'block';
        }
      });
    });

    // Set initial state on load based on URL hash
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.substring(1);
      const signupForm = document.getElementById('signup');
      const loginForm = document.getElementById('login');

      if (hash === 'login') {
        signupForm.style.display = 'none';
        loginForm.style.display = 'block';
      } else {
        signupForm.style.display = 'block';
        loginForm.style.display = 'none';
      }
      // Replace with your actual backend URL
const API_BASE = "http://localhost:4000/api";

async function loginUser(email, password) {
  try {
    const res = await fetch(`${API_BASE}/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.message || "Login failed");

    console.log("Login successful", data);
    // Save token, redirect, etc.
  } catch (err) {
    console.error("Login error:", err.message);
  }
}
async function signupUser(name, email, password) {
  try {
    const res = await fetch(`${API_BASE}/signup`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ name, email, password }),
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.message || "Signup failed");

    console.log("Signup successful", data);
    // Redirect or show success
  } catch (err) {
    console.error("Signup error:", err.message);
  }
}


    });
  </script>

</body>
</html>
